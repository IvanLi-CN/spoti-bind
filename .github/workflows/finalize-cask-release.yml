name: Finalize Cask release

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to finalize
        required: true
        type: string
      merge_sha:
        description: Immutable product merge SHA
        required: true
        type: string
      release_run_id:
        description: Release workflow run that created the Draft
        required: true
        type: string
      cask_merge_sha:
        description: Merged Cask sync PR SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: finalize-cask-${{ github.event.inputs.tag || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Publish verified Cask release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'automation/cask-release-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize Cask finalization context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_CASK_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MERGE_SHA: ${{ inputs.merge_sha }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_CASK_MERGE_SHA: ${{ inputs.cask_merge_sha }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          jq -n \
            --arg event "$EVENT_NAME" \
            --arg pr_number "$EVENT_PR_NUMBER" \
            --arg event_cask_merge_sha "$EVENT_CASK_MERGE_SHA" \
            --arg tag "$INPUT_TAG" \
            --arg merge_sha "$INPUT_MERGE_SHA" \
            --arg release_run_id "$INPUT_RELEASE_RUN_ID" \
            --arg cask_merge_sha "${INPUT_CASK_MERGE_SHA:-$EVENT_CASK_MERGE_SHA}" \
            '{event:$event,pr_number:$pr_number,tag:$tag,merge_sha:$merge_sha,release_run_id:$release_run_id,cask_merge_sha:$cask_merge_sha,event_cask_merge_sha:$event_cask_merge_sha}' \
            > "$work/cask-finalize-context.json"
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - name: Resolve Cask merge identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_CASK_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MERGE_SHA: ${{ inputs.merge_sha }}
          INPUT_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          INPUT_CASK_MERGE_SHA: ${{ inputs.cask_merge_sha }}
          WORK: ${{ steps.context.outputs.work }}
        run: |
          set -euo pipefail
          work="$WORK"
          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            pr_number="$EVENT_PR_NUMBER"
            cask_merge_sha="$EVENT_CASK_MERGE_SHA"
            [[ "$pr_number" =~ ^[0-9]+$ && "$cask_merge_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Cask pull request identity is invalid' >&2
              exit 1
            }
            [[ "$EVENT_HEAD_REPO" == "$GITHUB_REPOSITORY" && "$EVENT_BASE_REPO" == "$GITHUB_REPOSITORY" && \
              "$EVENT_BASE_REF" == 'main' && "$EVENT_HEAD_REF" == automation/cask-release-* ]] || {
              echo 'Cask finalization requires an internal automation PR targeting main' >&2
              exit 1
            }
          else
            pr_number=""
            cask_merge_sha="$INPUT_CASK_MERGE_SHA"
            [[ "$cask_merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Cask merge SHA is invalid' >&2; exit 1; }
          fi
          git fetch --no-tags origin main "$cask_merge_sha"
          git merge-base --is-ancestor "$cask_merge_sha" origin/main || {
            echo 'Cask merge is not part of the trusted main history' >&2
            exit 1
          }
          parents="$(git show -s --format=%P "$cask_merge_sha")"
          [[ "$(wc -w <<<"$parents" | tr -d ' ')" == '2' ]] || {
            echo 'Cask release requires a normal two-parent PR merge' >&2
            exit 1
          }
          cask_head="${parents##* }"
          commit_message="$(git show -s --format=%B "$cask_head")"
          tag="$(sed -n 's/^Cask-Release-Tag: //p' <<<"$commit_message")"
          merge_sha="$(sed -n 's/^Cask-Release-Merge-SHA: //p' <<<"$commit_message")"
          release_run_id="$(sed -n 's/^Cask-Release-Run-ID: //p' <<<"$commit_message")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$merge_sha" =~ ^[0-9a-f]{40}$ && "$release_run_id" =~ ^[0-9]+$ ]] || {
            echo 'Cask commit is missing immutable release trailers' >&2
            exit 1
          }
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$tag" == "$INPUT_TAG" && "$merge_sha" == "$INPUT_MERGE_SHA" && "$release_run_id" == "$INPUT_RELEASE_RUN_ID" ]] || {
              echo 'manual recovery inputs do not match the signed Cask commit' >&2
              exit 1
            }
            pr_numbers="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${cask_merge_sha}/pulls" --jq '.[].number')"
            [[ "$(wc -l <<<"$pr_numbers" | tr -d ' ')" == '1' ]] || {
              echo 'Cask merge must resolve to exactly one PR' >&2
              exit 1
            }
            pr_number="$(tr -d '\r\n' <<<"$pr_numbers")"
            pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '[.base.ref, .base.repo.full_name, (.head.repo.full_name // ""), .head.ref] | @tsv')"
            IFS=$'\t' read -r base_ref base_repo head_repo head_ref <<<"$pr_state"
            [[ "$base_ref" == 'main' && "$base_repo" == "$GITHUB_REPOSITORY" && \
              "$head_repo" == "$GITHUB_REPOSITORY" && "$head_ref" == automation/cask-release-* ]] || {
              echo 'Cask recovery PR identity is not trusted' >&2
              exit 1
            }
          fi
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels" --jq '[.[].name]')"
          intent="$(python3 .github/scripts/release_chain.py validate-labels --labels "$labels" --policy .github/pr-label-release.json)"
          [[ "$(jq -r '.type' <<<"$intent")" == 'type:none' ]] || { echo 'Cask PR must be type:none' >&2; exit 1; }
          [[ "$(jq -r '.channel' <<<"$intent")" == 'channel:stable' ]] || { echo 'Cask PR must use channel:stable' >&2; exit 1; }
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" --jq '.[].filename' | sort -u)"
          [[ "$files" == 'Casks/spotibind.rb' ]] || { echo 'Cask PR changed files outside Casks/spotibind.rb' >&2; exit 1; }
          grep -qx 'Release-Mode: no-release' <<<"$commit_message" || { echo 'Cask commit is not marked no-release' >&2; exit 1; }
          grep -qx 'Release-Type: type:none' <<<"$commit_message" || { echo 'Cask commit type marker is invalid' >&2; exit 1; }
          grep -qx 'Release-Channel: channel:stable' <<<"$commit_message" || { echo 'Cask commit channel marker is invalid' >&2; exit 1; }
          merge_verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${cask_merge_sha}" --jq '.commit.verification.verified')"
          head_verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${cask_head}" --jq '.commit.verification.verified')"
          [[ "$merge_verified" == 'true' && "$head_verified" == 'true' ]] || {
            echo 'Cask merge and head must be GitHub-verified' >&2
            exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/contents/Casks/spotibind.rb?ref=${cask_merge_sha}" \
            --jq '.content' | tr -d '\r\n' | base64 --decode > "$work/spotibind.rb"
          {
            echo "pr_number=$pr_number"
            echo "cask_merge_sha=$cask_merge_sha"
            echo "cask_head=$cask_head"
            echo "tag=$tag"
            echo "merge_sha=$merge_sha"
            echo "release_run_id=$release_run_id"
          } >> "$GITHUB_OUTPUT"
      - name: Persist resolved Cask identity
        if: steps.identity.outcome == 'success'
        env:
          WORK: ${{ steps.context.outputs.work }}
          TAG: ${{ steps.identity.outputs.tag }}
          TARGET_SHA: ${{ steps.identity.outputs.merge_sha }}
          RELEASE_RUN_ID: ${{ steps.identity.outputs.release_run_id }}
          CASK_MERGE_SHA: ${{ steps.identity.outputs.cask_merge_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$TAG" \
            --arg merge_sha "$TARGET_SHA" \
            --arg cask_merge_sha "$CASK_MERGE_SHA" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            '{tag:$tag,merge_sha:$merge_sha,cask_merge_sha:$cask_merge_sha,release_run_id:$release_run_id}' \
            > "$WORK/cask-finalize-context.json"
      - name: Verify Draft assets and Cask identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          WORK: ${{ steps.context.outputs.work }}
          TAG: ${{ steps.identity.outputs.tag }}
          TARGET_SHA: ${{ steps.identity.outputs.merge_sha }}
          RELEASE_RUN_ID: ${{ steps.identity.outputs.release_run_id }}
          CASK_MERGE_SHA: ${{ steps.identity.outputs.cask_merge_sha }}
        run: |
          set -euo pipefail
          run_meta="$(gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion)"
          [[ "$(jq -r '.workflowName' <<<"$run_meta")" == 'Release' && \
            "$(jq -r '.conclusion' <<<"$run_meta")" == 'success' ]] || {
            echo 'release run is not a successful Release workflow' >&2
            exit 1
          }
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-provenance --dir "$WORK/provenance"
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-identity --dir "$WORK/target"
          identity="$WORK/provenance/release-identity.json"
          target_from_run="$(tr -d '\r\n' < "$WORK/target/release-target-sha.txt")"
          [[ "$target_from_run" == "$TARGET_SHA" ]] || { echo 'release run target mismatch' >&2; exit 1; }
          [[ "$(jq -r '.merge_sha' "$identity")" == "$TARGET_SHA" ]] || { echo 'release provenance mismatch' >&2; exit 1; }
          version="$(jq -r '.version' "$identity")"
          [[ "$TAG" == "v${version}" ]] || { echo 'release tag/version mismatch' >&2; exit 1; }
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == 'true' ]] || { echo 'release is not Draft' >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == 'false' ]] || { echo 'release must not be prerelease' >&2; exit 1; }
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
          tag_target="$(jq -r '.object.sha' <<<"$tag_ref")"
          if [[ "$tag_type" == 'tag' ]]; then
            tag_target="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_target}" --jq '.object.sha')"
          fi
          [[ "$tag_target" == "$TARGET_SHA" ]] || { echo 'release tag target mismatch' >&2; exit 1; }
          dmg="SpotiBind-${version}-universal.dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$dmg" --pattern SHA256SUMS --dir "$WORK/assets"
          (
            cd "$WORK/assets"
            shasum -a 256 -c SHA256SUMS
          )
          sha256="$(awk -v file="$dmg" '$2 == file { print $1 }' "$WORK/assets/SHA256SUMS")"
          python3 .github/scripts/homebrew_cask.py check \
            --path "$WORK/spotibind.rb" --version "$version" --sha256 "$sha256"
          expected_assets="$(printf '%s\n' SHA256SUMS "$dmg" | sort)"
          actual_assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/$(jq -r '.id' <<<"$release_json")/assets" --paginate --jq '.[].name' | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo 'Draft release asset set is not the exact single-build set' >&2
            exit 1
          }
          jq -n --arg tag "$TAG" --arg version "$version" --arg target "$TARGET_SHA" \
            --arg cask_merge "$CASK_MERGE_SHA" --arg sha256 "$sha256" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            '{tag:$tag,version:$version,merge_sha:$target,cask_merge_sha:$cask_merge,sha256:$sha256,release_run_id:$release_run_id}' \
            > "$WORK/cask-finalize-context.json"
          {
            echo "release_id=$(jq -r '.id' <<<"$release_json")"
            echo "version=$version"
            echo "sha256=$sha256"
            echo "dmg=$dmg"
          } >> "$GITHUB_OUTPUT"
      - name: Publish public Release after Cask verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.verify.outputs.release_id }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version }}
          TARGET_SHA: ${{ steps.identity.outputs.merge_sha }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=false \
            -f name="SpotiBind ${VERSION}" \
            -f body="Automated public release for verified main merge ${TARGET_SHA}; Homebrew Cask identity verified from the same DMG."
          echo "Published ${TAG} only after same-repository Homebrew Cask verification." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cask finalization context
        if: always() && steps.context.outputs.work != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cask-finalization-context
          path: ${{ steps.context.outputs.work }}/cask-finalize-context.json
          if-no-files-found: ignore
