name: Notify release failure

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  context:
    name: Build release failure context
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.context.outputs.target_sha }}
      source_sha: ${{ steps.context.outputs.source_sha }}
      version: ${{ steps.context.outputs.version }}
      tag: ${{ steps.context.outputs.tag }}
      assets: ${{ steps.context.outputs.assets }}
      details: ${{ steps.context.outputs.details }}
    steps:
      - name: Resolve immutable release context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-identity --dir "$work" 2>/dev/null || true
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-provenance --dir "$work" 2>/dev/null || true
          if [[ -s "$work/release-target-sha.txt" ]]; then
            TARGET_SHA="$(tr -d '\r\n' < "$work/release-target-sha.txt")"
          elif [[ "$RUN_EVENT" == 'workflow_dispatch' ]]; then
            echo 'dispatch recovery identity artifact is missing; refusing ambiguous notification' >&2
            exit 1
          fi
          source_sha="unknown"
          if [[ -s "$work/release-identity.json" ]]; then
            source_sha="$(jq -r '.source_sha // "unknown"' "$work/release-identity.json")"
          fi
          prs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/pulls" --jq '[.[] | {number,source_sha:.head.sha,labels:[.labels[].name]}]')"
          version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/VERSION?ref=${TARGET_SHA}" --jq '.content' | tr -d '\n' | base64 -d | tr -d '\r\n' || echo unknown)"
          tag="v${version}"
          assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name]' 2>/dev/null || printf '["SpotiBind-%s-universal.dmg","SHA256SUMS"]' "$version")"
          details="PR and labels: ${prs}; source SHA: ${source_sha}; merge SHA: ${TARGET_SHA}; version: ${version}; tag: ${tag}; assets: ${assets}; recovery: rerun Release with workflow_dispatch commit_sha=${TARGET_SHA}"
          {
            echo "target_sha=${TARGET_SHA}"
            echo "source_sha=${source_sha}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "assets=${assets}"
            echo "details=${details}"
          } >> "$GITHUB_OUTPUT"
  notify:
    name: Notify release failure
    needs: context
    if: needs.context.result == 'success'
    uses: IvanLi-CN/github-workflows/.github/workflows/release-failure-telegram.yml@main
    with:
      repository: ${{ github.repository }}
      workflow_name: Release
      conclusion: failure
      run_url: ${{ github.event.workflow_run.html_url }}
      ref_label: main
      head_sha: ${{ needs.context.outputs.target_sha }}
      event_name: ${{ github.event.workflow_run.event }}
      extra_details: ${{ needs.context.outputs.details }}
    secrets:
      SHOUTRRR_URL: ${{ secrets.SHOUTRRR_URL }}
