name: Label Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: label-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Label Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate trusted label snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo 'fork pull requests cannot receive release preparation' >&2
            exit 1
          fi
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/labels" --jq '[.[].name]')"
          python3 .github/scripts/release_chain.py validate-labels \
            --labels "$labels" --policy .github/pr-label-release.json | tee release-intent.json
          {
            echo '### Label Gate';
            echo; echo 'Runtime label snapshot:';
            echo '```json'; cat release-intent.json; echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
